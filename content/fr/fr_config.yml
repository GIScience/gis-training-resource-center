# Book settings
# French Jupyter Book configuration

title: Centre de ressources pour la formation SIG
author: HeiGIT gGmbH
copyright: HeiGIT gGmbH
logo: ../../IFRC_Logo_Horizontal_RGB.svg

# Force re-execution of notebooks on each build.
execute:
  execute_notebooks: force

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/GIScience/gis-training-resource-center
  path_to_book: content/es
  branch: main

# Add GitHub buttons to your book
html:
  favicon: ../../IFRC_Logo_favicon.png
  use_issues_button: true
  use_repository_button: true
  extra_footer: |
      <script data-goatcounter="https://gtrc.goatcounter.com/count"
      async src="//gc.zgo.at/count.js"></script>
      <p>
      Este proyecto se publica bajo una <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr">licencia Creative Commons BY-NC-SA 4.0</a>.
      </p>
  announcement: "Vous souhaitez contribuer ? Consultez les lignes directrices de contribution et contactez-nous !"

exclude_patterns:
  - .venv/*
  - venv/*

sphinx:
  extra_extensions:
    - custom-launch-buttons
  config:
    # Partner logos used by About/about_1.md live in the repo-level _static folder
    html_static_path: ["../../_static"]
    # Hide noisy warnings. Links and anchors are checked on the built site instead
    # (scripts/check_site_links.py), because MyST doesn't recognise our stable <a id> anchors.
    suppress_warnings:
      - myst.xref_missing        # link/anchor targets (false alarms for <a id> anchors)
      - myst.header              # skipped heading levels, e.g. H1 -> H3
      - design.grid              # sphinx-design grid layout hints
      - misc.highlighting_failure  # code blocks in an unknown language
